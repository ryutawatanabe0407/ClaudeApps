<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- サボテンの本体 -->
  <g id="cactus-body">
    <!-- 中央の幹 -->
    <rect x="75" y="50" width="50" height="130" rx="25" fill="#2E8B57"/>

    <!-- 左側の腕 -->
    <ellipse cx="50" cy="90" rx="20" ry="40" fill="#2E8B57"/>
    <rect x="50" y="70" width="25" height="40" fill="#2E8B57"/>

    <!-- 右側の腕 -->
    <ellipse cx="150" cy="100" rx="20" ry="35" fill="#2E8B57"/>
    <rect x="125" y="85" width="25" height="35" fill="#2E8B57"/>

    <!-- 影をつける -->
    <rect x="78" y="50" width="3" height="130" fill="#1a5a35" opacity="0.3"/>
  </g>

  <!-- サボテンのトゲ -->
  <g id="thorns" stroke="#F5F5DC" stroke-width="2" opacity="0.8">
    <!-- 中央の幹のトゲ -->
    <line x1="85" y1="60" x2="80" y2="55"/>
    <line x1="95" y1="65" x2="100" y2="60"/>
    <line x1="105" y1="70" x2="110" y2="65"/>
    <line x1="85" y1="80" x2="80" y2="75"/>
    <line x1="115" y1="85" x2="120" y2="80"/>
    <line x1="85" y1="100" x2="80" y2="95"/>
    <line x1="105" y1="105" x2="110" y2="100"/>
    <line x1="95" y1="120" x2="90" y2="115"/>
    <line x1="115" y1="125" x2="120" y2="120"/>
    <line x1="85" y1="140" x2="80" y2="135"/>
    <line x1="105" y1="145" x2="110" y2="140"/>
    <line x1="95" y1="160" x2="90" y2="155"/>

    <!-- 左腕のトゲ -->
    <line x1="45" y1="75" x2="40" y2="72"/>
    <line x1="55" y1="85" x2="60" y2="82"/>
    <line x1="45" y1="95" x2="40" y2="92"/>
    <line x1="50" y1="105" x2="45" y2="102"/>

    <!-- 右腕のトゲ -->
    <line x1="145" y1="90" x2="140" y2="87"/>
    <line x1="155" y1="100" x2="160" y2="97"/>
    <line x1="145" y1="110" x2="140" y2="107"/>
  </g>

  <!-- 花 -->
  <g id="flower">
    <circle cx="110" cy="45" r="8" fill="#FF69B4"/>
    <circle cx="110" cy="45" r="4" fill="#FFD700"/>
  </g>

  <!-- 地面の影 -->
  <ellipse cx="100" cy="185" rx="35" ry="10" fill="rgba(0,0,0,0.3)"/>
</svg>
