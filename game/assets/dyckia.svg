      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(315)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(345)" filter="url(#shadow)"/>
    </g>

    <!-- 内側の若い葉 -->
    <g>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(22.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(67.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(112.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(157.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(202.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(247.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
            fill="#f5f5f5" stroke="#c8c8c8" stroke-width="0.5" transform="rotate(292.5)" filter="url(#shadow)"/>
      <path d="M 0,-35 Q -2,-28 -2.5,-21 Q -3,-14 -3,-7 Q -3,0 -2,5 L 2,5 Q 3,0 3,-7 Q 3,-14 2.5,-21 Q 2,-28 0,-35 Z"
