            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(15)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(45)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(75)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(105)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(135)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(165)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(195)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(225)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
            fill="url(#leafGrad)" stroke="#b0b0b0" stroke-width="0.5" transform="rotate(255)" filter="url(#shadow)"/>
      <path d="M 0,-55 Q -2.5,-45 -3,-35 Q -3.5,-25 -4,-15 Q -4,0 -3,8 L 3,8 Q 4,0 4,-15 Q 3.5,-25 3,-35 Q 2.5,-45 0,-55 Z"
