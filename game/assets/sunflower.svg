<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ひまわりの花びら -->
  <g id="petals">
    <!-- 外側の花びら（12枚） -->
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFD700" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFC700" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFD700" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFC700" transform="rotate(90 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFD700" transform="rotate(120 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFC700" transform="rotate(150 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFD700" transform="rotate(180 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFC700" transform="rotate(210 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFD700" transform="rotate(240 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFC700" transform="rotate(270 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFD700" transform="rotate(300 100 100)"/>
    <ellipse cx="100" cy="30" rx="15" ry="35" fill="#FFC700" transform="rotate(330 100 100)"/>
  </g>

  <!-- 中心部（種の部分） -->
  <circle cx="100" cy="100" r="35" fill="#8B4513"/>

  <!-- 種の模様 -->
  <g id="seeds" opacity="0.6">
    <circle cx="90" cy="90" r="3" fill="#654321"/>
    <circle cx="110" cy="90" r="3" fill="#654321"/>
    <circle cx="85" cy="100" r="3" fill="#654321"/>
    <circle cx="100" cy="95" r="3" fill="#654321"/>
    <circle cx="115" cy="100" r="3" fill="#654321"/>
    <circle cx="90" cy="110" r="3" fill="#654321"/>
    <circle cx="110" cy="110" r="3" fill="#654321"/>
    <circle cx="100" cy="105" r="3" fill="#654321"/>
    <circle cx="95" cy="100" r="3" fill="#654321"/>
    <circle cx="105" cy="100" r="3" fill="#654321"/>
  </g>

  <!-- 影 -->
  <ellipse cx="100" cy="180" rx="30" ry="10" fill="rgba(0,0,0,0.3)"/>
</svg>
