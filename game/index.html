<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🔫 ディッキアシューター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- スタート画面 -->
        <div id="startScreen" class="screen">
            <div class="title-area">
                <h1 class="game-title">🔫 ディッキアシューター</h1>
                <p class="game-subtitle">ディッキアを撃ちまくれ！ FPS</p>
            </div>
            <div class="menu-area">
                <button class="btn btn-start" id="startBtn">
                    <span class="btn-icon">🎯</span>
                    ゲームスタート
                </button>
                <div class="high-score">
                    <span class="label">ハイスコア:</span>
                    <span class="value" id="highScoreDisplay">0</span>
                </div>
            </div>
            <div class="instructions">
                <h3>遊び方</h3>
                <ul>
                    <li>🖱️ マウスで照準を合わせる</li>
                    <li>🔫 クリックで射撃</li>
                    <li>🌵 ディッキアを撃ってスコアGET</li>
                    <li>💥 連続ヒットでコンボボーナス</li>
                    <li>⏱️ 制限時間60秒</li>
                    <li>🔄 Rキーでリロード（弾数30発）</li>
                </ul>
            </div>
            <a href="../index.html" class="back-link">← ガントチャートツールへ戻る</a>
        </div>

        <!-- ゲーム画面 -->
        <div id="gameScreen" class="screen" style="display: none;">
            <div class="game-header">
                <div class="hud-left">
                    <div class="score-display">
                        <span class="label">スコア:</span>
                        <span class="value" id="scoreDisplay">0</span>
                    </div>
                    <div class="combo-display" id="comboDisplay" style="display: none;">
                        <span class="combo-value" id="comboValue">0</span>
                        <span class="combo-label">COMBO!</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="time-display">
                        <span class="label">⏱️</span>
                        <span class="value" id="timeDisplay">60</span>
                    </div>
                    <div class="ammo-display">
                        <span class="label">🔫</span>
                        <span class="value" id="ammoDisplay">30/30</span>
                    </div>
                </div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <!-- クロスヘア（照準） -->
            <div class="crosshair">
                <div class="crosshair-dot"></div>
                <div class="crosshair-line crosshair-top"></div>
                <div class="crosshair-line crosshair-bottom"></div>
                <div class="crosshair-line crosshair-left"></div>
                <div class="crosshair-line crosshair-right"></div>
            </div>

            <!-- リロード表示 -->
            <div id="reloadDisplay" class="reload-display" style="display: none;">
                <span class="reload-text">🔄 RELOADING...</span>
            </div>

            <!-- ヒットマーカー -->
            <div id="hitMarker" class="hit-marker" style="display: none;">
                <div class="hit-line hit-line-1"></div>
                <div class="hit-line hit-line-2"></div>
                <div class="hit-line hit-line-3"></div>
                <div class="hit-line hit-line-4"></div>
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameOverScreen" class="screen" style="display: none;">
            <div class="game-over-content">
                <h1 class="game-over-title">TIME UP!</h1>
                <div class="final-score-area">
                    <p class="label">最終スコア</p>
                    <p class="score" id="finalScore">0</p>
                </div>
                <div class="high-score-area" id="newHighScoreArea" style="display: none;">
                    <p class="new-high-score">🎉 新記録！ 🎉</p>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">ヒット数:</span>
                        <span class="stat-value" id="hitCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最高コンボ:</span>
                        <span class="stat-value" id="maxCombo">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">命中率:</span>
                        <span class="stat-value" id="accuracy">0%</span>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn btn-restart" id="restartBtn">
                        <span class="btn-icon">🔄</span>
                        もう一度
                    </button>
                    <button class="btn btn-menu" id="menuBtn">
                        <span class="btn-icon">🏠</span>
                        メニュー
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
