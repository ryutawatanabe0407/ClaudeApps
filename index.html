<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gantt Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gantt-style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-inner">
        <div class="header-text">
          <h1>Gantt Chart</h1>
          <p>プロジェクトのタスクを視覚的に管理</p>
        </div>
        <div style="display: flex; gap: 15px;">
          <a href="game/" style="text-decoration: none; color: #10B981; font-weight: 500;">🔫 シューティングゲーム</a>
          <a href="dyckia-growth/" style="text-decoration: none; color: #10B981; font-weight: 500;">🌵 育成ゲーム</a>
        </div>
        <div class="header-stats" id="headerStats"></div>
      </div>
    </header>

    <main>
      <div class="controls">
        <button class="btn btn-primary" id="addTaskBtn">+ タスクを追加</button>
        <button class="btn btn-secondary" id="importBtn">↑ インポート</button>
        <button class="btn btn-secondary" id="exportBtn">↓ エクスポート</button>
        <button class="btn btn-danger" id="clearAllBtn">✕ すべて削除</button>
        <input type="file" id="importFile" accept=".xlsx" style="display:none">
        <div class="filter-bar">
          <select class="filter-select" id="filterStatus">
            <option value="all">すべてのステータス</option>
            <option value="todo">TODO</option>
            <option value="in_progress">進行中</option>
            <option value="done">完了</option>
          </select>
          <select class="filter-select" id="filterSort">
            <option value="order">並び順</option>
            <option value="start_date">開始日順</option>
            <option value="end_date">終了日順</option>
            <option value="progress_desc">進捗率↓</option>
          </select>
        </div>
      </div>

      <!-- タスクフォーム -->
      <div class="task-form" id="taskForm" style="display:none">
        <h3 id="formTitle">新しいタスク</h3>
        <div class="form-group">
          <label for="taskName">タスク名</label>
          <input type="text" id="taskName" placeholder="タスク名を入力">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="startDate">開始日</label>
            <input type="date" id="startDate">
          </div>
          <div class="form-group">
            <label for="endDate">終了日</label>
            <input type="date" id="endDate">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="progress">進捗率: <span id="progressValue">0</span>%</label>
            <input type="range" id="progress" min="0" max="100" value="0">
          </div>
          <div class="form-group">
            <label for="taskStatus">ステータス</label>
            <select class="filter-select" id="taskStatus" style="width:100%">
              <option value="todo">TODO</option>
              <option value="in_progress">進行中</option>
              <option value="done">完了</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="taskColor">カラー</label>
          <input type="color" id="taskColor" value="#2563EB">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="saveTaskBtn">保存</button>
          <button class="btn btn-secondary" id="cancelTaskBtn">キャンセル</button>
        </div>
      </div>

      <!-- タスク一覧 -->
      <div class="task-list">
        <div class="task-list-header">
          <h3>タスク一覧</h3>
          <span class="task-count" id="taskCount">0 件</span>
        </div>
        <div id="tasks"></div>
      </div>

      <!-- ガントチャート -->
      <div class="gantt-container">
        <div class="gantt-container-header">
          <h3>ガントチャート</h3>
          <div class="gantt-controls">
            <label for="timeScale">時間軸:</label>
            <select id="timeScale" class="time-scale-select">
              <option value="day">日単位</option>
              <option value="week">週単位</option>
              <option value="month">月単位</option>
            </select>
            <button class="btn-icon" id="zoomInBtn">+ ズーム</button>
            <button class="btn-icon" id="zoomOutBtn">- ズーム</button>
            <button class="btn-icon" id="todayBtn">今日</button>
          </div>
        </div>
        <div class="gantt-chart" id="ganttChart">
          <div class="gantt-empty">
            <div class="gantt-empty-icon">📊</div>
            <span>タスクを追加してガントチャートを表示しましょう</span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <span>Gantt Chart — powered by Node.js + SQLite</span>
      <span style="color:var(--text-muted)">v2.0</span>
    </footer>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="gantt-script.js"></script>
</body>
</html>
